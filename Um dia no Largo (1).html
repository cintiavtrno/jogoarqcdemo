:root{color-scheme:dark;--ink:#3B1F0E;--pink:#FF4DB8;--yel:#FFD21F;--ora:#FF6A1F;--blu:#2F3BFF;--grn:#19E68C;--crm:#F4EFE0;--bg:#2a1a10}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--crm)}
body{font:16px/1.45 'Archivo',system-ui,sans-serif;font-weight:700;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.title h1{margin:0;font:400 44px/1 'Anton',sans-serif;text-transform:uppercase;color:var(--crm)}
.title h1 span{background:var(--yel);color:var(--ink);padding:0 10px;display:inline-block;transform:rotate(-2deg);box-shadow:5px 5px 0 var(--pink)}
.title p{margin:0;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#d8c4a8}
.stage{position:relative;border:6px solid var(--ink);box-shadow:10px 10px 0 var(--pink);background:var(--pink);aspect-ratio:16/9;width:100%;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:manipulation;outline:none}
#hudwrap{position:absolute;inset:0;pointer-events:none}
#tasks{position:absolute;left:12px;top:12px;background:var(--grn);color:var(--ink);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:8px 14px 8px;transform:rotate(-2deg);min-width:180px}
#tasks b{font:400 20px/1 'Anton',sans-serif;text-transform:uppercase;display:block;margin-bottom:4px}
#tasks ul{list-style:none;margin:0;padding:0;font-size:14px;font-weight:800}
#tasks li{display:flex;align-items:center;gap:8px;padding:1px 0}
#tasks li::before{content:'';width:14px;height:14px;border:3px solid var(--ink);background:var(--crm);flex:none}
#tasks li.ok::before{background:var(--ora)}
#tasks li.ok{text-decoration:line-through;text-decoration-thickness:2px}
#tasks li.lock{opacity:.55}
#badge{position:absolute;right:12px;top:10px;width:96px;height:96px;border-radius:50%;background:var(--yel);color:var(--ink);border:5px solid var(--ink);transform:rotate(10deg);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#badge b{font:400 30px/1 'Anton',sans-serif}
#badge small{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
#dlg{position:absolute;left:4%;right:4%;bottom:4%;cursor:pointer}
#dtag{display:inline-block;font:400 24px/1 'Anton',sans-serif;text-transform:uppercase;padding:6px 14px;border:4px solid var(--ink);margin-left:14px;margin-bottom:-4px;position:relative;z-index:1;transform:rotate(-2deg)}
#dbox{background:var(--crm);color:var(--ink);border:5px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:16px 20px 12px;min-height:84px;font-size:clamp(16px,2.2vw,21px);font-weight:800;line-height:1.35}
#dtxt.narra{font-style:italic}
#dbox small{display:block;text-align:right;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-top:4px}

<script>
(()=>{
'use strict';
const OUT='#3B1F0E',PINK='#FF4DB8',YEL='#FFD21F',ORA='#FF6A1F',BLU='#2F3BFF',GRN='#19E68C',CRM='#F4EFE0',PLUM='#6A2A5B',BRK='#C2542B';

const hsh=(a,b,c)=>{const n=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return n-Math.floor(n)};
const lerp=(a,b,t)=>a+(b-a)*t;
function mix(c1,c2,t){const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const a=p(c1),b=p(c2);return'#'+a.map((v,i)=>Math.round(lerp(v,b[i],t)).toString(16).padStart(2,'0')).join('')}

const WHO={lia:{n:'Lia',c:YEL,t:OUT},aurea:{n:'Dona Aurea',c:ORA,t:OUT},dandara:{n:'Dandara',c:GRN,t:OUT},raimundo:{n:'Seu Raimundo',c:BLU,t:CRM},davi:{n:'Davi',c:BLU,t:CRM},vendedor:{n:'Vendedor',c:CRM,t:OUT},zefa:{n:'Dona Zefa',c:PINK,t:OUT},nilton:{n:'Seu Nilton',c:GRN,t:OUT},cida:{n:'Dona Cida',c:ORA,t:OUT},locutora:{n:'Rádio Pelô',c:PINK,t:OUT},agente:{n:'Agente do Programa',c:CRM,t:OUT},narra:null};
const STAGES=[
{year:'1991',tit:'O Programa começa',life:.9,tour:2,

 {id:'pao',x:700,tag:'Pão da Dona Aurea',lines:[['aurea','Bom dia, Lia! O pão saiu agora mesmo.'],['lia','Me vê cinco, Dona Aurea. Anota na caderneta, que o mês tá apertado.'],['aurea','Anoto, minha filha. Aqui todo mundo se conhece desde sempre.']]},
 {id:'dand',x:1190,tag:'Café com Dandara',lines:[['dandara','Lia! Sobe pra tomar um café. A mãe de Raimundo perguntou de você.'],['lia','Ela melhorou?'],['dandara','Melhorou porque sempre tem alguém passando aqui. Nessa rua, a gente cuida um do outro.']]},
 {id:'roda',x:1465,tag:'Roda no largo',lines:[['raimundo','Chegou na hora, Lia! Sem roda, sábado não é sábado.'],['lia','Quem vai puxar o samba?'],['raimundo','Quem tiver voz. Aqui ninguém paga ingresso pra ser da festa.']]}]},
{year:'ANOS 90',tit:'Reforma e visitação',life:.5,tour:7,
 card:'As fachadas ganham tinta nova e os turistas chegam. As famílias são cadastradas e muitas aceitam sair. O Estado paga aluguéis e programação gratuita.',
 spots:[
 {id:'pao',x:700,tag:'Café Pelô',lines:[['aurea','Agora é Café Pelô. Cardápio novo, até em inglês.'],['lia','E o meu pão?'],['aurea','Guardei debaixo do balcão. Mas o aluguel do ponto subiu, Lia.'],['lia','Quem decide o que cabe nessa rua agora?']]},
 {id:'raim',x:175,tag:'Casa de Seu Raimundo',lines:[['narra','Janela fechada. A placa de ALUGA-SE ainda tem cheiro de tinta.'],['lia','Seu Raimundo aceitou a indenização. Foi pra longe, onde o dinheiro rendia mais.'],['narra','O Estado pagou. A casa continua aqui. A família não.']]},
 {id:'palco',x:1465,tag:'Palco no largo',lines:[['davi','Agora tem horário: quinta e sábado, às oito, quando o ônibus chega.'],['lia','E a roda de verdade?'],['davi','Virou ensaio. A gente toca pra quem passa, mas já não é pra gente.']]}]},
{year:'2000',tit:'O Largo de vitrine',life:.18,tour:9,
 card:'Em 1980, moravam cerca de 9,8 mil pessoas no Centro Histórico. Em 2000, cerca de 3 mil. Das 1.674 famílias cadastradas, só 103 resistiram.',note:'Dados do artigo de 2009 usado na disciplina.',
 spots:[
 {id:'loja',x:700,tag:'Lembranças',lines:[['vendedor','Ímã, chaveiro, camiseta. O que a senhora vai querer?'],['lia','Aqui era a padaria.'],['vendedor','Não sei de padaria. Tenho ímã de pão, se a senhora quiser.']]},
 {id:'dand',x:1190,tag:'Dandara',lines:[['dandara','Eu fico. A AMACH segue de pé: somos 103 famílias.'],['lia','Com o largo vazio de noite?'],['dandara','A visitação já está caindo. Turista não mora, passa. Quando o movimento passa, a vitrine apaga.']]},
 {id:'largo',x:1465,tag:'Largo à noite',req:'dand',lines:[['narra','Os ônibus foram embora. A programação gratuita ainda acontece, paga pelo Estado, para quase ninguém.'],['lia','Era aqui a roda.'],['dandara','Senta aqui. A gente recomeça com o que sobrou.'],['narra','Sem vida cotidiana, a vitrine só dura enquanto alguém paga a luz.']]}]}
];
const S={scene:'card',stage:0,x:400,face:1,walk:false,cam:0,done:{},sky:0,t:0,target:null,dlg:null,li:0,typed:0,tour:[],keys:{},fade:0};

/* ---------- desenho ---------- */
function rr(x,y,w,h,f,lw){ctx.fillStyle=f;ctx.fillRect(x,y,w,h);if(lw!==0){ctx.lineWidth=lw||4;ctx.strokeStyle=OUT;ctx.strokeRect(x,y,w,h)}}
function poly(p,f,lw){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fillStyle=f;ctx.fill();if(lw!==0){ctx.lineWidth=lw||4;ctx.strokeStyle=OUT;ctx.stroke()}}
function circ(x,y,r,f,lw){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=f;ctx.fill();if(lw!==0){ctx.lineWidth=lw||4;ctx.strokeStyle=OUT;ctx.stroke()}}
function star(x,y,r,f,lw){const p=[];for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,k=i%2?r*.3:r;p.push([x+Math.cos(a)*k,y+Math.sin(a)*k])}poly(p,f,lw)}
function txt(s,x,y,size,col,align,font){ctx.font=size+'px '+(font||"'Anton',sans-serif");ctx.fillStyle=col||OUT;ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y)}

function person(x,o){o=o||{};const y=o.y!=null?o.y:GY+20,s=o.s||1,d=o.dir||1,w=o.walk?Math.sin(S.t*10+(o.ph||0))*6:0;
 ctx.save();ctx.translate(x,y);ctx.scale(s*d,s);ctx.lineJoin='round';ctx.lineWidth=3.5;ctx.strokeStyle=OUT;
 rr(-13+w*.5,-36,11,36,o.pants||BLU,3.5);rr(2-w*.5,-36,11,36,o.pants||BLU,3.5);
 if(o.skirt){poly([[-18,-60],[18,-60],[24,-26],[-24,-26]],o.skirt,3.5)}
 rr(-17,-86,34,o.skirt?34:52,o.body||YEL,3.5);
 if(o.apron)rr(-12,-70,24,36,CRM,3);
 rr(-26,-84-w*.3,9,34,o.body||YEL,3.5);rr(17,-84+w*.3,9,34,o.body||YEL,3.5);
 circ(-21,-48,6,o.skin||'#8A4B2A',3);circ(21,-48,6,o.skin||'#8A4B2A',3);
 circ(0,-104,20,o.skin||'#8A4B2A',3.5);
 if(o.hair!==false){circ(-2,-122,13,o.hair||OUT,3);if(o.puff)circ(-12,-118,10,o.hair||OUT,3)}
 if(o.hat==='cap'){rr(-20,-126,36,14,BLU,3.5);rr(8,-116,20,8,BLU,3)}
 if(o.hat==='sun'){poly([[-30,-114],[30,-114],[18,-134],[-18,-134]],o.hatc||PINK,3.5)}
 if(o.hat==='band'){rr(-20,-120,40,10,o.hatc||ORA,3)}
 circ(7,-106,2.4,OUT,0);
 if(o.cam)rr(-8,-76,18,13,'#222',2.5);
 if(o.bag)rr(14,-48,20,24,'#E8C48A',3);
 if(o.drum){circ(18,-52,12,ORA,3.5)}
 ctx.restore()}

function win(wx,wy,lit,i,f,c){rr(wx-5,wy-5,46,68,CRM,3);
 if(lit){rr(wx,wy,36,58,YEL,3);if(S.stage<2&&hsh(i,f,c+9)<.4){circ(wx+18,wy+26,9,OUT,0);rr(wx+7,wy+36,22,22,OUT,0)}}
 else if(hsh(i,f,c)<.5)rr(wx,wy,36,58,GRN,3),ctx.beginPath(),ctx.moveTo(wx+18,wy),ctx.lineTo(wx+18,wy+58),ctx.lineWidth=2.5,ctx.stroke();
 else rr(wx,wy,36,58,PLUM,3);
 if(lit&&S.stage===0&&hsh(i,f,c+3)<.35){circ(wx+10,wy+66,6,GRN,2.5);circ(wx+26,wy+66,6,ORA,2.5)}}

const B=[{x:60,w:230,fl:3,c:BLU,door:115,id:'raim'},{x:300,w:250,fl:3,c:GRN},{x:560,w:300,fl:2,c:ORA,door:null,id:'padaria'},{x:870,w:200,fl:3,c:CRM},{x:1080,w:260,fl:3,c:YEL,door:110,id:'dand'},{x:1620,w:300,fl:4,c:CRM,church:true},{x:1930,w:260,fl:3,c:ORA,door:120},{x:2200,w:260,fl:3,c:BLU}];
function building(b,i){const top=GY-b.fl*105-30,h=GY-top;
 poly([[b.x-10,top],[b.x+b.w+10,top],[b.x+b.w-8,top-24],[b.x+8,top-24]],BRK);
 rr(b.x,top,b.w,h,b.c);rr(b.x-7,top,b.w+14,16,CRM,3);rr(b.x-7,GY-14,b.w+14,14,CRM,3);
 const cols=Math.max(2,Math.floor((b.w-30)/64)),gap=(b.w-48)/cols;
 let life=STAGES[S.stage].life;if(b.id==='dand')life=[.95,.9,.75][S.stage];if(b.id==='raim')life=(S.mode==='res'?(S.R.h.rai.left?0:.95):[.95,0,0][S.stage]);
 for(let f=0;f<b.fl;f++)for(let c=0;c<cols;c++){const wx=b.x+24+c*gap+(gap-36)/2-6,wy=GY-30-(f+1)*105+22;
  if(f===0&&b.door!=null&&Math.abs(wx+18-(b.x+b.door))<48)continue;
  if(f===0&&(b.id==='padaria'))continue;
  win(wx,wy,hsh(i,f,c)<life,i,f,c);
  if(f===1&&i%2===0){rr(wx-12,wy+52,60,8,OUT,0);for(let k=0;k<6;k++)rr(wx-10+k*10,wy+34,3,18,OUT,0)}}
 if(b.door!=null){const dx=b.x+b.door-26;rr(dx-6,GY-122,64,122,CRM,3);ctx.beginPath();ctx.arc(dx+26,GY-100,26,Math.PI,0);ctx.fillStyle=PLUM;ctx.fill();rr(dx,GY-100,52,100,PLUM,3);circ(dx+42,GY-50,3.5,YEL,0)}}

 rr(x,GY-300,300,300,CRM);rr(x+300,top,120,GY-top,BLU);rr(x+312,top+10,96,GY-top-10,YEL,3);
 poly([[x+300,top],[x+420,top],[x+360,top-70]],YEL);rr(x+318,top+60,84,90,BLU,3);ctx.beginPath();ctx.arc(x+360,top+60,42,Math.PI,0);ctx.fillStyle=BLU;ctx.fill();ctx.stroke();circ(x+360,top+90,16,YEL,3);
 circ(x+360,top+240,18,CRM,3);for(let k=0;k<3;k++)rr(x+322+k*28,top+300,18,70,BLU,3);
 poly([[x,GY-300],[x+300,GY-300],[x+260,GY-380],[x+40,GY-380]],BLU);poly([[x+60,GY-380],[x+240,GY-380],[x+150,GY-450]],YEL);
 for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(x+60+k*90,GY-210,28,Math.PI,0);ctx.fillStyle=BLU;ctx.fill();ctx.lineWidth=4;ctx.stroke();rr(x+32+k*90,GY-210,56,110,BLU,4)}
 rr(x+110,GY-120,80,120,PLUM,4)}

function padaria(){const x=560,w=300,st=S.mode==='res'?(S.R.h.aur.left?(S.stage>1?2:1):0):S.stage;
 const c=[ORA,ORA,ORA][st];rr(x+20,GY-190,w-40,190,'#2a1a10',4);

 for(let k=0;k<6;k++){const sw=(w-40)/6;poly([[x+20+k*sw,GY-200],[x+20+(k+1)*sw,GY-200],[x+20+(k+1)*sw+4,GY-150],[x+16+k*sw,GY-150]],k%2?(st===1?YEL:CRM):(st===1?BLU:ORA),3)}

 rr(x+20,GY-70,w-40,16,CRM,3.5);
 if(st<2){for(let k=0;k<5;k++){ctx.beginPath();ctx.ellipse(x+50+k*34,GY-82,15,9,0,0,7);ctx.fillStyle='#E8B060';ctx.fill();ctx.lineWidth=3;ctx.stroke()}}
 else{const cs=[PINK,GRN,BLU,YEL,ORA,CRM];for(let k=0;k<6;k++){rr(x+34+k*40,GY-140,30,30,cs[k],3);rr(x+34+k*40,GY-100,30,30,cs[(k+2)%6],3)}}
 if(st===1){for(let k=0;k<2;k++){const tx=x+w+30+k*70;rr(tx-2,GY-72,6,60,OUT,0);poly([[tx-34,GY-72],[tx+36,GY-72],[tx+2,GY-110]],k?PINK:YEL,3.5);circ(tx,GY-8,0,OUT,0)}}}

function festaScene(){const st=S.stage;
 if(st===0){const cs=[PINK,YEL,BLU,GRN,ORA];for(let k=0;k<13;k++){const bx=1345+k*20,by=GY-250+Math.sin(k/12*Math.PI)*34+(RM?0:Math.sin(S.t*2+k)*2);poly([[bx,by],[bx+16,by],[bx+8,by+22]],cs[k%5],2.5)}
  person(1380,{body:PINK,pants:OUT,dir:1,walk:true,ph:1,puff:true});person(1560,{body:GRN,pants:BLU,dir:-1,walk:true,ph:3,skin:'#B86B3E',hat:'band'})}
 if(st===1){rr(1385,GY-34,230,34,'#B98A52',4);rr(1385,GY-70,230,40,'#C99A60',4);for(let k=0;k<3;k++)circ(1430+k*70,GY-100+k*0,0,OUT,0);
  for(let k=0;k<5;k++){rr(1385+k*56,GY-30,6,30,OUT,0)}ctx.lineWidth=4;ctx.strokeStyle=OUT;ctx.beginPath();ctx.moveTo(1380,GY-70);ctx.lineTo(1620,GY-70);ctx.stroke()}
 if(st===2){rr(1470,GY-10,120,10,BLU,3);rr(1480,GY-50,100,10,BLU,3);rr(1486,GY-40,6,40,OUT,0);rr(1568,GY-40,6,40,OUT,0)}}

 rr(x,y,240,50,YEL,4);txt('BEM-VINDO AO',x+120,y+15,18);txt('CENTRO HISTÓRICO',x+120,y+36,20)}

 if(S.stage===2||(S.mode==='res'&&S.R.asm)){rr(x-6,y,132,70,CRM,4);txt('AMACH',x+60,y+22,28);txt('EU MORO AQUI',x+60,y+50,16,OUT,'center',"'Archivo',sans-serif")}}

function sky(){const p=S.sky,c=p<.5?mix(PINK,'#FF7A3D',p*2):mix('#FF7A3D','#2A1A9E',(p-.5)*2);ctx.fillStyle=c;ctx.fillRect(0,0,VW,VH);
 if(p>.55){ctx.globalAlpha=Math.min(1,(p-.55)/.35);for(let k=0;k<22;k++)star(hsh(k,1,1)*VW,hsh(k,2,2)*230+20,4+hsh(k,3,3)*5,CRM,0);ctx.globalAlpha=1}
